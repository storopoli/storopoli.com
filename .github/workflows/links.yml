name: Links Check
# runs every monday at 9 am
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch: null

permissions: {}

jobs:
  check-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Typst
        uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3
        with:
          typst-version: "0.15.0"

      - name: Install Pandoc
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1.1.1
        with:
          version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build site
        run: ./scripts/build.sh

      - name: Check all links in built site
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --cache --root-dir "${{ github.workspace }}/_site" --no-progress "_site"
          fail: false

      # Workaround for lycheeverse/lychee#2319: lychee v0.24.2 does not retry
      # rejected 5xx/408 status codes despite max_retries = 3 (fixed upstream
      # in lycheeverse/lychee#2324, not yet in a tagged release). Re-run with
      # the cache populated by the first pass so only failed/uncached links are
      # re-checked after a short backoff, without masking persistent outages.
      - name: Wait before retrying failed links
        if: steps.lychee.outputs.exit_code != '0'
        run: sleep 15

      - name: Re-check failed links
        if: steps.lychee.outputs.exit_code != '0'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --cache --root-dir "${{ github.workspace }}/_site" --no-progress "_site"
          fail: true
